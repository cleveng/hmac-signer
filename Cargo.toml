[package]
name = "hmac-signer"
version = "1.0.5"
description = "Hmac Signer By Rust"
authors = ["cleveng <cleveng@gmail.com>"]
license = "MIT"
edition = "2024"
repository = "https://github.com/cleveng/hmac-signer.git"
rust-version = "1.92.0"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
hmac = "0.13.0"
hex = "0.4.3"
subtle = "2.6.1"
sha2 = "0.11.1"

anyhow = "1.0.104"
wasm-bindgen = { version = "0.2.130", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.149"

js-sys = "0.3.107"
console_error_panic_hook = "0.1.7"
serde_json_canonicalizer = "0.4.1"

[dev-dependencies]
