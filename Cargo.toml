[package]
name = "hmac-signer"
version = "1.0.0"
description = "Hmac Signer By Rust"
authors = ["cleveng <cleveng@gmail.com>"]
license = "MIT"
edition = "2024"
repository = "https://github.com/cleveng/hmac-signer.git"
rust-version = "1.92.0"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
hmac = "0.13.0"
sha2 = "0.11.1"
hex = "0.4.3"

anyhow = "1.0.104"
wasm-bindgen = { version = "0.2.130", optional = true }

[dev-dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.149"
